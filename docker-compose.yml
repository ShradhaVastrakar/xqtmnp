# Start everything:  docker compose up --build
# Dashboard: http://localhost:${FRONTEND_PORT:-3000}   API docs: http://localhost:${BACKEND_PORT:-8000}/docs
services:
  backend:
    build: ./Backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DECISION_CUTOFF_TIME: ${DECISION_CUTOFF_TIME:-09:00}
      DECISION_CUTOFF_DAYS_AHEAD: ${DECISION_CUTOFF_DAYS_AHEAD:-1}
      HOURLY_FORECAST_FILL: ${HOURLY_FORECAST_FILL:-none}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      CACHE_DIR: /app/.cache
    volumes:
      - elexon-cache:/app/.cache
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        # Resolved by the browser, so it must be reachable from the host machine.
        VITE_API_URL: ${VITE_API_URL:-https://int-sol-back.khelo.tech
}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  elexon-cache:
